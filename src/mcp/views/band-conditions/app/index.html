<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Band Conditions</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="panel" data-state="waiting">
      <header class="panel-header">
        <h1 class="panel-title">Band conditions</h1>
        <div class="header-actions">
          <p class="meta" data-slot="updated">Fetching from HamQSL&hellip;</p>
          <button type="button" class="button" data-slot="refresh">
            Refresh
          </button>
        </div>
      </header>

      <div class="top">
        <figure class="sun">
          <div class="sun-frame">
            <img data-slot="sun-image" alt="" width="512" height="512" />
          </div>
          <figcaption class="meta" data-slot="sun-caption"></figcaption>
          <div
            class="sun-views"
            role="group"
            aria-label="Solar image"
            data-slot="sun-views"
          ></div>
        </figure>

        <section class="hf">
          <table class="hf-table">
            <thead>
              <tr>
                <th scope="col" class="label">HF bands</th>
                <th scope="col" class="label">Day</th>
                <th scope="col" class="label">Night</th>
              </tr>
            </thead>
            <tbody data-slot="hf-rows"></tbody>
          </table>
        </section>
      </div>

      <section
        class="readouts"
        aria-label="Solar indices"
        data-slot="readouts"
      ></section>

      <section class="vhf">
        <h2 class="label">VHF</h2>
        <ul data-slot="vhf-list"></ul>
      </section>

      <p class="credits">
        Conditions by N0NBH, hamqsl.com &middot; Solar images courtesy of
        NASA/SDO and the AIA and HMI science teams
      </p>
    </main>
  </body>
</html>
