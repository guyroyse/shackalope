<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Band Activity</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="panel" data-state="waiting" data-feed="connecting">
      <header class="panel-header">
        <div>
          <h1 class="panel-title">Band activity</h1>
          <p class="meta where" data-slot="where">
            Connecting to PSKReporter&hellip;
          </p>
        </div>
        <p class="meta live" data-slot="live">
          <span class="live-dot" aria-hidden="true"></span>
          <span data-slot="live-label">Connecting</span>
        </p>
      </header>

      <p class="notice" data-slot="notice" hidden></p>

      <div class="grid-wrap">
        <table class="grid">
          <caption class="visually-hidden">
            Stations heard nearby in the last 15 minutes, by band and the
            sender's continent
          </caption>
          <thead>
            <tr data-slot="continents"></tr>
          </thead>
          <tbody data-slot="rows"></tbody>
        </table>
      </div>

      <p class="detail" data-slot="detail" aria-live="polite"></p>

      <footer class="footer">
        <div
          class="legend"
          aria-label="Stations heard"
          data-slot="legend"
        ></div>
        <p class="credits">
          Reception reports from PSKReporter (pskreporter.info) &middot;
          Continents from AD1C's country files
        </p>
      </footer>
    </main>
  </body>
</html>
